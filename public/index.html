<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F5C518">
  <title>駐輪許可証リマインダー - 千葉大学</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow: #F5C518;
      --yellow-dark: #d4a800;
      --yellow-light: #FFFDE7;
      --text: #212121;
      --text-muted: #757575;
      --border: #E0E0E0;
      --radius: 14px;
      --line-green: #06C755;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN',
                   'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: var(--yellow-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
    }

    .card {
      background: #fff;
      border-radius: var(--radius);
      padding: 28px 24px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 2px 24px rgba(0,0,0,0.10);
    }

    .header { text-align: center; margin-bottom: 20px; }

    .badge {
      display: inline-block;
      background: var(--yellow);
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 4px 14px;
      border-radius: 100px;
      margin-bottom: 14px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .header .desc {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.7;
    }

    hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 14px;
      color: var(--text);
      line-height: 1.5;
    }

    .step-num {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      background: var(--yellow);
      border-radius: 50%;
      font-weight: 800;
      font-size: 13px;
      flex-shrink: 0;
    }

    .step-text strong {
      display: block;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .step-text small {
      color: var(--text-muted);
      font-size: 12px;
    }

    .line-btn-wrap {
      text-align: center;
      margin: 8px 0 16px;
    }

    .line-btn-wrap a img {
      width: 200px;
      border-radius: 8px;
    }

    .line-id {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .example-box {
      background: #F8F8F8;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13px;
      color: var(--text);
      line-height: 1.8;
      margin-top: 4px;
    }

    .example-box .label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .bubble {
      display: inline-block;
      background: var(--line-green);
      color: #fff;
      border-radius: 18px 18px 18px 4px;
      padding: 6px 14px;
      margin: 2px 0;
      font-size: 14px;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 11px;
      color: #BDBDBD;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="badge">千葉大学 無断駐輪対策</div>
    <h1>🚲 駐輪許可証<br>リマインダー</h1>
    <p class="desc">
      LINEで友だち追加して<br>
      登校時刻を送るだけ！
    </p>
  </div>

  <hr>

  <div class="steps">
    <div class="step">
      <span class="step-num">1</span>
      <div class="step-text">
        <strong>下のボタンで友だち追加</strong>
        <small>LINEアプリが開きます</small>
      </div>
    </div>
    <div class="step">
      <span class="step-num">2</span>
      <div class="step-text">
        <strong>LINEで登校時刻を送信</strong>
        <small>「明日 08:30」のように送るだけ</small>
      </div>
    </div>
    <div class="step">
      <span class="step-num">3</span>
      <div class="step-text">
        <strong>当日その時刻に通知が届く</strong>
        <small>バイブレーション・音でお知らせ</small>
      </div>
    </div>
  </div>

  <div class="line-btn-wrap">
    <a href="https://line.me/R/ti/p/@786xlcyh">
      <img src="https://scdn.line-apps.com/n/line_add_friends/btn/ja.png" alt="友だち追加">
    </a>
    <p class="line-id">ID: @786xlcyh</p>
  </div>

  <hr>

  <div class="example-box">
    <div class="label">送り方の例</div>
    <div class="bubble">明日 08:30</div><br>
    <div class="bubble">今日 17:00</div><br>
    <div class="bubble">6/5 08:30</div>
  </div>

  <div class="footer">千葉大学 キャンパス整備係</div>
</div>

<script>
fetch('/track-access').catch(() => {});
</script>
</body>
</html>
