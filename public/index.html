<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F5C518">
  <link rel="manifest" href="/manifest.json">
  <title>駐輪許可証リマインダー - 千葉大学</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow: #F5C518;
      --yellow-dark: #d4a800;
      --yellow-light: #FFFDE7;
      --text: #212121;
      --text-muted: #757575;
      --border: #E0E0E0;
      --radius: 14px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN',
                   'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: var(--yellow-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
    }

    .card {
      background: #fff;
      border-radius: var(--radius);
      padding: 28px 24px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 2px 24px rgba(0,0,0,0.10);
    }

    .header { text-align: center; margin-bottom: 20px; }

    .badge {
      display: inline-block;
      background: var(--yellow);
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 4px 14px;
      border-radius: 100px;
      margin-bottom: 14px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .header .desc {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.7;
    }

    hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

    .alert {
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13.5px;
      line-height: 1.65;
      margin-bottom: 16px;
    }
    .alert strong { display: block; margin-bottom: 4px; }
    .alert-warn { background: #FFF8E1; border: 1px solid #FFD54F; color: #6D4C00; }
    .alert-err  { background: #FFEBEE; border: 1px solid #EF9A9A; color: #B71C1C; }
    .alert-ok   { background: #E8F5E9; border: 1px solid #A5D6A7; color: #1B5E20; }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    .form-group { margin-bottom: 16px; }

    input[type="email"] {
      display: block;
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 2px solid var(--yellow);
      border-radius: 10px;
      outline: none;
      color: var(--text);
      background: #FFFDF5;
      transition: border-color .15s, box-shadow .15s;
      -webkit-appearance: none;
    }
    input[type="email"]:focus {
      border-color: var(--yellow-dark);
      box-shadow: 0 0 0 3px rgba(245,197,24,.25);
    }

    input[type="time"] {
      display: block;
      width: 100%;
      padding: 14px 16px;
      font-size: 28px;
      font-weight: 300;
      text-align: center;
      border: 2px solid var(--yellow);
      border-radius: 10px;
      outline: none;
      color: var(--text);
      background: #FFFDF5;
      transition: border-color .15s, box-shadow .15s;
      -webkit-appearance: none;
    }
    input[type="time"]:focus {
      border-color: var(--yellow-dark);
      box-shadow: 0 0 0 3px rgba(245,197,24,.25);
    }

    .hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.5;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      background: var(--yellow);
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s, transform .1s, opacity .15s;
      -webkit-tap-highlight-color: transparent;
      margin-top: 4px;
    }
    .btn:hover  { background: var(--yellow-dark); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .success-view { text-align: center; display: none; }
    .success-icon { font-size: 60px; margin-bottom: 14px; }
    .success-view h2 { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
    .success-view p { font-size: 14px; color: var(--text-muted); line-height: 1.7; margin-bottom: 20px; }

    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 11px;
      color: #BDBDBD;
    }
  </style>
</head>
<body>
<div class="card">

  <div id="main">
    <div class="header">
      <div class="badge">千葉大学 無断駐輪対策</div>
      <h1>🚲 駐輪許可証<br>リマインダー</h1>
      <p class="desc">
        明日の登校時刻をセットすると、<br>
        その時刻に許可証購入をメールでお知らせします。
      </p>
    </div>

    <hr>

    <div class="form-group">
      <label class="form-label" for="email-input">📧 メールアドレス</label>
      <input type="email" id="email-input" placeholder="example@g.chiba-u.jp" autocomplete="email">
      <p class="hint">翌朝このアドレスに通知が届きます</p>
    </div>

    <div class="form-group">
      <label class="form-label" for="time-input">🕐 明日の登校時刻</label>
      <input type="time" id="time-input" value="08:30">
      <p class="hint">この時刻にメールが届きます</p>
    </div>

    <button class="btn" id="submit-btn" onclick="submitEmail()">
      ✉️ リマインダーを設定する
    </button>

    <div id="status-msg"></div>
  </div>

  <div id="success-view" class="success-view">
    <div class="success-icon">✅</div>
    <h2>設定完了！</h2>
    <p id="success-detail"></p>
    <button class="btn" onclick="resetForm()">もう一度設定する</button>
  </div>

  <div class="footer">千葉大学 キャンパス整備係</div>
</div>

<script>
fetch('/track-access').catch(() => {});

async function submitEmail() {
  const email = document.getElementById('email-input').value.trim();
  const time  = document.getElementById('time-input').value;

  if (!email) { setStatus('メールアドレスを入力してください。', 'err'); return; }
  if (!time)  { setStatus('登校時刻を入力してください。', 'err'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '送信中…';
  clearStatus();

  try {
    const res = await fetch('/subscribe-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, scheduledTime: time })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'エラーが発生しました');

    const [hh, mm] = time.split(':');
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    const dateStr = `${tomorrow.getMonth() + 1}月${tomorrow.getDate()}日`;

    document.getElementById('success-detail').textContent =
      `${dateStr} ${hh}:${mm} に「${email}」へ通知メールをお送りします。`;

    document.getElementById('main').style.display = 'none';
    document.getElementById('success-view').style.display = 'block';

  } catch (err) {
    setStatus(err.message, 'err');
    btn.disabled = false;
    btn.textContent = '✉️ リマインダーを設定する';
  }
}

function resetForm() {
  document.getElementById('main').style.display = '';
  document.getElementById('success-view').style.display = 'none';
  document.getElementById('submit-btn').disabled = false;
  document.getElementById('submit-btn').textContent = '✉️ リマインダーを設定する';
  clearStatus();
}

function setStatus(msg, type) {
  document.getElementById('status-msg').innerHTML =
    `<div class="alert alert-${type}" style="margin-top:16px">${msg}</div>`;
}
function clearStatus() {
  document.getElementById('status-msg').innerHTML = '';
}
</script>
</body>
</html>
